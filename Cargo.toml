[package]
name = "bevy_stable_id"
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
authors = ["8th Boundary"]
description = "Compact, persistent, cross-platform identifiers for Bevy ecosystem crates"
license = "MIT OR Apache-2.0"
repository = "https://github.com/8th-Boundary/bevy_stable_id"
homepage = "https://github.com/8th-Boundary/bevy_stable_id"
readme = "README.md"
keywords = ["bevy", "identifier", "identity", "persistence", "save"]
categories = ["game-development", "data-structures"]

[features]
default = ["random", "serde"]
random = ["dep:rand"]
serde = ["dep:serde"]

[dependencies]
blake3 = "1"
rand = { version = "0.10", optional = true }
serde = { version = "1", optional = true }
thiserror = "2"

[dev-dependencies]
postcard = { version = "1.1", features = ["alloc", "use-std"] }
serde_json = "1"
